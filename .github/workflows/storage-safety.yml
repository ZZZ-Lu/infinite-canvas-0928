name: Storage safety
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:storage
      - run: npm run lint
      - run: npm run build
